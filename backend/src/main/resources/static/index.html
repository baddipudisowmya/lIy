<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIY Backend</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #f8f8f8; margin: 0; padding: 24px; }
        .container { max-width: 760px; margin: 0 auto; }
        h1 { margin-bottom: 0.5rem; color: #a855f7; }
        p { color: #d1d5db; line-height: 1.6; }
        .api-list { margin-top: 1.5rem; padding-left: 1.25rem; }
        a { color: #60a5fa; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .badge { display: inline-block; margin-top: 1rem; padding: 0.35rem 0.75rem; background: #1f2937; border-radius: 999px; color: #c7d2fe; font-size: 0.95rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LIY Backend is running</h1>
        <p>The API is available at <strong>/api</strong>. This app does not currently serve the full front-end UI from this backend package.</p>
        <p>Use the following endpoints to verify the service:</p>
        <ul class="api-list">
            <li><a href="/api/health">/api/health</a></li>
            <li><a href="/api/roles">/api/roles</a></li>
            <li><a href="/api/mcq/sde">/api/mcq/sde</a></li>
        </ul>
        <div class="badge">Backend Port: 8082</div>
    </div>
</body>
</html>
